[package]
name = "cms_dl"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
curl = { version = "0.4.49", features = ["ntlm"] }
dialoguer = "0.12.0"
html-escape = "0.2.13"
indicatif = { version = "0.18.2", features = ["improved_unicode"] }
regex = "1.12.2"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"

[profile.release]
panic = 'abort'
opt-level = "z"
lto = true
codegen-units = 1
strip = true
